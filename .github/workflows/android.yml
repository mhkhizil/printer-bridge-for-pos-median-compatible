name: Android CI

# On every push to main this builds the APKs and republishes the rolling
# "latest" GitHub release, so the newest installable APK is always one stable
# link away and nobody has to build locally:
#
#   https://github.com/mhkhizil/printer-bridge-for-pos-median-compatible/releases/latest/download/LinkitPOS.apk
#
# Pull requests build and upload the APK as a run artifact only.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      pos_url:
        description: "POS URL baked into this build (blank: use POS_URL or https://app.mmlnkits.com)"
        required: false
        default: ""

# Builds for the same branch queue instead of cancelling each other: killing a run in
# the middle of its publish step can leave the rolling "latest" release deleted but
# not recreated, which 404s the download link shops install from.
concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      # Always bake in a real URL, even when no repository variable is configured.
      POS_URL: ${{ inputs.pos_url || vars.POS_URL || 'https://app.mmlnkits.com' }}

    outputs:
      version_name: ${{ steps.version.outputs.name }}
      version_code: ${{ steps.version.outputs.code }}

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Configure and validate Android SDK
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_DIR" ] || [ ! -d "$SDK_DIR" ]; then
            echo "::error::ANDROID_HOME or ANDROID_SDK_ROOT must point to an installed Android SDK."
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          printf 'sdk.dir=%s\nposUrl=%s\n' "$SDK_DIR" "$POS_URL" > local.properties
          echo "Using Android SDK: $SDK_DIR"

      # GitHub's ubuntu runners ship the Android SDK and cmdline-tools, so install the
      # exact packages this project targets. A third-party setup action is avoided on
      # purpose: they break whenever Google moves the cmdline-tools download URLs.
      - name: Install required SDK packages
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n 1)"
          fi
          echo "using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - name: Read version from Gradle
        id: version
        run: |
          NAME="$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          CODE="$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -n 1)"
          test -n "$NAME" && test -n "$CODE"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Linkit POS $NAME ($CODE)"

      # Optional: a release keystore makes the release APK installable and
      # upgradable over earlier installs. Without these secrets the build still
      # succeeds; the release APK is then unsigned (the debug APK always works).
      - name: Restore release keystore
        # Pull requests can carry repository secrets when they come from branches in
        # this repo, so never hand the production keystore to PR-controlled code.
        # The secrets live on this step (not the job env) so the Gradle build that
        # PR code can modify never sees them.
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No ANDROID_KEYSTORE_BASE64 secret: the release APK will be unsigned."
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
          echo "Release keystore restored."

      # The release build is included on purpose: it runs R8 and resource
      # shrinking, which is what proves the keep rules for the JS bridge work.
      - name: Build debug and release APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease "-PposUrl=$POS_URL" --no-daemon --stacktrace

      # Stable file names keep the release download URLs permanent.
      - name: Collect APKs
        run: |
          mkdir -p ci
          cp app/build/outputs/apk/debug/app-debug.apk ci/LinkitPOS.apk
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk ci/LinkitPOS-release.apk
          elif [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk \
              ci/LinkitPOS-release-unsigned.apk
          fi
          ls -lh ci

      - name: Upload APKs as run artifact
        uses: actions/upload-artifact@v4
        with:
          name: LinkitPOS-apk
          path: ci/*.apk
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish latest APK
    needs: build
    # Only main may move the rolling "latest" release: a manual run from a feature
    # branch used to republish it with untested APKs.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    # Publishing is serialized independently of the build concurrency group, so two
    # runs can never delete/recreate the rolling release at the same time.
    concurrency:
      group: rolling-latest
      cancel-in-progress: false

    permissions:
      contents: write

    steps:
      - name: Download built APKs
        uses: actions/download-artifact@v4
        with:
          name: LinkitPOS-apk
          path: apk

      # One rolling release under the moving "latest" tag. Recreating it (instead
      # of adding a release per commit) keeps /releases/latest/download/<file>
      # pointing at the newest APK forever.
      - name: Publish rolling "latest" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_NAME: ${{ needs.build.outputs.version_name }}
          VERSION_CODE: ${{ needs.build.outputs.version_code }}
          POS_URL_VALUE: ${{ inputs.pos_url || vars.POS_URL || 'https://app.mmlnkits.com' }}
        run: |
          REPO="$GITHUB_REPOSITORY"

          cat > notes.md <<EOF
          Built automatically from \`${GITHUB_SHA:0:7}\` on \`${GITHUB_REF_NAME}\`.

          - Version: **${VERSION_NAME}** (versionCode ${VERSION_CODE})
          - POS URL baked in: \`${POS_URL_VALUE}\`
          - Build log: ${GITHUB_SERVER_URL}/${REPO}/actions/runs/${GITHUB_RUN_ID}

          | File | Use |
          | --- | --- |
          | \`LinkitPOS.apk\` | Always installable (debug key; filename has no debug suffix) |
          | \`LinkitPOS-release.apk\` | Signed release build, only when the keystore secrets are configured |

          **Installing over an older copy:** this APK is signed with a different key
          than a build made on your own machine, so uninstall the old app once
          before installing this one.
          EOF

          gh release delete latest --repo "$REPO" --yes --cleanup-tag || true
          gh release create latest apk/*.apk \
            --repo "$REPO" \
            --target "$GITHUB_SHA" \
            --title "Latest build ${VERSION_NAME} (${VERSION_CODE})" \
            --notes-file notes.md
          gh release view latest --repo "$REPO"
